# LLM 生成配置（PRD D8 / §3.3 生成步骤）
# 密钥不落库：运行时从本机 ~/.arkcli/config.yaml 的 coding-plan profile 解析，
# 或使用环境变量 ARK_CODING_API_KEY（优先级更高）。

llm:
  provider: ark_coding          # 火山方舟 Coding Plan（Anthropic 兼容 Messages API）
  model: claude-sonnet-4-20250514   # ARK coding-plan 映射到 doubao-seed-2-1-turbo
  max_tokens: 6000
  temperature: 0.3
  fallback_model: claude-haiku-4-5-20251001
  cost_guard:
    max_tokens_per_run: 120000     # 单期生成 token 上限（熔断用）
    max_calls_per_run: 12
